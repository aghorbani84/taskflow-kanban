<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskflow — Kanban Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme BEFORE first paint (no white flash).
      // Defaults: style modern; mode from prefers-color-scheme.
      try {
        var s = localStorage.getItem('showcase-style');
        var m = localStorage.getItem('showcase-mode');
        document.documentElement.dataset.style =
          s === 'achaemenid' || s === 'modern' ? s : 'modern';
        document.documentElement.dataset.mode =
          m === 'light' || m === 'dark'
            ? m
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        document.documentElement.dataset.style = 'modern';
        document.documentElement.dataset.mode = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
